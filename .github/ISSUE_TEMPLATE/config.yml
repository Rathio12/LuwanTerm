blank_issues_enabled: true
contact_links:
  - name: Ask a question
    url: https://github.com/Rathio12/LuwanTerm/discussions/categories/q-a
    about: How do I do X, does it support Y, why does it behave like this. Questions get answered faster in Discussions than in the issue tracker.
  - name: Suggest an idea
    url: https://github.com/Rathio12/LuwanTerm/discussions/categories/ideas
    about: Something you want LuwanTerm to do. Discuss it first - an idea with agreement behind it turns into a good issue.
  - name: Report a security problem
    url: https://github.com/Rathio12/LuwanTerm/security/advisories/new
    about: Never open a public issue for a vulnerability. This reports it privately.
  - name: Read the guides
    url: https://github.com/Rathio12/LuwanTerm/tree/main/guides
    about: Keys, SFTP, tunnels, configuration, building and signing are all documented.
