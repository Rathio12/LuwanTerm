name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for, e.g. v1.0.0. Leave empty to only build artifacts.'
        type: string
        required: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version $version matches the tag"

      - name: Project checks
        run: node build/check-project.js

      # Signs the build when the certificate secrets exist, and produces an
      # unsigned build when they do not. See docs/signing.md.
      - name: Build installer and portable
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run dist

      - name: Report what was produced
        shell: bash
        run: ls -lh dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LuwanTerm-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 30

      # Safe to re-run: updates an existing release's assets rather than
      # failing, so the same tag can be rebuilt without deleting anything.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "publishing release for $tag"

          # latest.yml is what the in-app updater reads, so it has to ship too.
          assets=()
          for file in dist/*.exe dist/*.blockmap dist/latest.yml; do
            [ -f "$file" ] && assets+=("$file")
          done
          echo "attaching: ${assets[*]}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release exists, replacing its assets"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "LuwanTerm $tag" --generate-notes --verify-tag
          fi
          gh release view "$tag" --json name,assets --jq '"published \(.name) with \(.assets | length) assets"'
