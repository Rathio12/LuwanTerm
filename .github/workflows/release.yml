name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release (otherwise just upload build artifacts)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version $version matches the tag"

      - name: Project checks
        run: node build/check-project.js

      # Signs the build when the certificate secrets exist, and produces an
      # unsigned build when they do not. See docs/signing.md.
      - name: Build installer and portable
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run dist

      - name: Report what was produced
        shell: bash
        run: ls -lh dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LuwanTerm-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/*.exe dist/*.blockmap \
            --title "LuwanTerm $tag" \
            --generate-notes \
            --verify-tag
