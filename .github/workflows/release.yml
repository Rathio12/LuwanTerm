name: Release

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.1.0. Leave empty to only build artifacts.'
        type: string
        required: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide
    if: github.ref != 'refs/heads/beta'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A release happens when package.json names a version that has no release
      # yet. Bumping the version and pushing is all it takes.
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ -z "$INPUT_TAG" ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "will release $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows build
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ needs.decide.outputs.tag }}"
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version $version matches $tag"

      - name: Project checks
        run: node build/check-project.js

      # npm run dist bakes the config, but that happens after this, and the
      # suites need it: an empty client id makes the Discord client refuse to
      # start, so the tests would cover a configuration no release ever has.
      - name: Bake the build config
        run: npm run bake

      # A release that fails its own suites should never reach anyone.
      - name: Tests
        run: npm test

      # Signs the build when the certificate secrets exist, and produces an
      # unsigned build when they do not. See guides/signing.md.
      - name: Build installer and portable
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Signs the build's provenance record, so a genuine release can be
          # told apart from a repackaged one. Absent, the build is still stamped
          # but unsigned - which is what a fork's own build looks like.
          PROVENANCE_KEY: ${{ secrets.PROVENANCE_KEY }}
        run: npm run dist

      - name: Report what was produced
        shell: bash
        run: ls -lh dist/*.exe

      # electron-builder logs "signing with signtool.exe" even when no
      # certificate was supplied, and produces an unsigned binary anyway. Every
      # release up to 1.8.3 went out unsigned without anyone noticing.
      - name: Check the binaries are signed
        env:
          EXPECT_SIGNED: ${{ secrets.WINDOWS_CERT_BASE64 != '' && '1' || '0' }}
        run: node build/check-signature.js

      - uses: actions/upload-artifact@v7
        with:
          name: LuwanTerm-windows
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      # Creates the tag as part of the release when publishing from a branch,
      # and replaces the assets when the release already exists.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          echo "publishing $TAG"

          assets=()
          for file in dist/*.exe dist/latest.yml; do
            [ -f "$file" ] && assets+=("$file")
          done
          echo "attaching: ${assets[*]}"

          node build/release-notes.js "$TAG" > release-notes.md
          echo "release notes:"
          sed 's/^/  /' release-notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release exists, replacing its assets and notes"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file release-notes.md

            # Releases published before the blockmap was dropped still carry
            # one. NSIS installers embed their own block map, so the separate
            # file was never used for differential updates - it is only clutter
            # in the download list.
            for stale in $(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".blockmap"))'); do
              echo "removing stale asset $stale"
              gh release delete-asset "$TAG" "$stale" --yes
            done
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "LuwanTerm $TAG" --notes-file release-notes.md --latest
          fi

          gh release view "$TAG" --json name,assets --jq '"published \(.name) with \(.assets | length) assets"'

  beta:
    name: Beta build
    if: github.ref == 'refs/heads/beta'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bake the build config
        run: npm run bake

      - name: Tests
        run: npm test

      # electron-builder reads the channel out of the version's prerelease tag,
      # so 1.9.0-beta.4 makes it write beta.yml rather than latest.yml. That is
      # the file the app looks for when someone ticks "Include beta builds";
      # without it the setting has nothing to find.
      - id: version
        shell: bash
        run: |
          base="$(node -p "require('./package.json').version")"
          version="${base%%-*}-beta.${GITHUB_RUN_NUMBER}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Build installer and portable
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PROVENANCE_KEY: ${{ secrets.PROVENANCE_KEY }}
        run: npm run dist

      - name: Report what was produced
        shell: bash
        run: ls -lh dist/*.exe dist/*.yml

      # electron-builder writes latest.yml whatever the version says - it takes
      # the channel from publish config, which this project does not use because
      # it uploads by hand. The updater asks for beta.yml when someone has ticked
      # "Include beta builds", and the file's contents are the same either way,
      # so the name is the whole of the difference.
      - name: Name the channel file for the beta channel
        shell: bash
        run: |
          if [ ! -f dist/latest.yml ]; then
            echo "no channel file was produced at all"
            ls -l dist/
            exit 1
          fi
          mv dist/latest.yml dist/beta.yml
          echo "beta.yml:"
          cat dist/beta.yml

      # Marked as a prerelease so it never becomes the download the front page
      # offers, and so electron-updater only considers it for people who asked.
      - name: Publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f dist/beta.yml ]; then
            echo "no beta.yml was produced - the updater would have nothing to read"
            ls -l dist/
            exit 1
          fi

          assets=()
          for file in dist/*.exe dist/beta.yml; do
            [ -f "$file" ] && assets+=("$file")
          done

          node build/release-notes.js "$VERSION" > release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "**This is a beta.** Built from the beta branch, with the same tests a release"
            echo "gets, but it is the version things break in. You only receive it if you ticked"
            echo "*Include beta builds* in Settings. Going back means installing a stable build"
            echo "by hand."
          } >> release-notes.md

          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "LuwanTerm $TAG" \
            --notes-file release-notes.md \
            --prerelease

          gh release view "$TAG" --json name,assets --jq '"published \(.name) with \(.assets | length) assets"'
