name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.1.0. Leave empty to only build artifacts.'
        type: string
        required: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A release happens when package.json names a version that has no release
      # yet. Bumping the version and pushing is all it takes.
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ -z "$INPUT_TAG" ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "will release $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows build
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ needs.decide.outputs.tag }}"
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version $version matches $tag"

      - name: Project checks
        run: node build/check-project.js

      # A release that fails its own suites should never reach anyone.
      - name: Tests
        run: npm test

      # Signs the build when the certificate secrets exist, and produces an
      # unsigned build when they do not. See guides/signing.md.
      - name: Build installer and portable
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run dist

      - name: Report what was produced
        shell: bash
        run: ls -lh dist/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: LuwanTerm-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 30

      # Creates the tag as part of the release when publishing from a branch,
      # and replaces the assets when the release already exists.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          echo "publishing $TAG"

          assets=()
          for file in dist/*.exe dist/*.blockmap dist/latest.yml; do
            [ -f "$file" ] && assets+=("$file")
          done
          echo "attaching: ${assets[*]}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release exists, replacing its assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "LuwanTerm $TAG" --generate-notes --latest
          fi

          gh release view "$TAG" --json name,assets --jq '"published \(.name) with \(.assets | length) assets"'
