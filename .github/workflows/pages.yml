name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/renderer/styles/tokens.css'
      - 'fonts/fonts.json'
      - 'guides/images/**'
      - 'build/make-site.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Copies the app's own tokens, the font catalogue and the screenshots into
      # docs/assets, so the published site can never drift from the app.
      - name: Assemble site assets
        run: node build/make-site.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
