<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
  <title>LuwanTerm</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6a2 2 0 0 1 2 2v.6l1.4.8.5-.3a2 2 0 0 1 2.7.7l.4.7a2 2 0 0 1-.7 2.7l-.5.3v1.8l.5.3a2 2 0 0 1 .7 2.7l-.4.7a2 2 0 0 1-2.7.7l-.5-.3-1.4.8v.6a2 2 0 0 1-2 2h-.8a2 2 0 0 1-2-2v-.6l-1.4-.8-.5.3a2 2 0 0 1-2.7-.7l-.4-.7a2 2 0 0 1 .7-2.7l.5-.3v-1.8l-.5-.3a2 2 0 0 1-.7-2.7l.4-.7a2 2 0 0 1 2.7-.7l.5.3 1.4-.8v-.6a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 4 4-4 4M12 16h7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.4.6L11.4 7H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 5.6.6l3-3A4 4 0 0 0 13 5l-1.7 1.7"/><path d="M14 11a4 4 0 0 0-5.6-.6l-3 3A4 4 0 0 0 11 19l1.7-1.7"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><rect x="8" y="4" width="12" height="12" rx="2"/><path d="M16 20H6a2 2 0 0 1-2-2V8"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.9 4.6"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M8 12l4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.4.6L11.4 7H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 4v8"/><path d="M7.5 6.5a7 7 0 1 0 9 0"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.4 3 7.7 7 9 4-1.3 7-4.6 7-9V6z"/></symbol>
    <symbol id="i-upload-cloud" viewBox="0 0 24 24"><path d="M12 19V9"/><path d="M8.5 12.5 12 9l3.5 3.5"/><path d="M6.5 17a4 4 0 0 1 .6-7.96 5.5 5.5 0 0 1 10.6 1.36A3.5 3.5 0 0 1 17.5 17"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="12" rx="4"/><path d="M9 8a3 3 0 0 1 6 0M4 12h4M16 12h4M5 7l2 2M19 7l-2 2M5 18l2.5-1.5M19 18l-2.5-1.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 12a7 7 0 0 1-7 7H8l-4 3v-4.2A7 7 0 0 1 4 12a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7z"/><path d="M9 11.5h.01M15 11.5h.01"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v3M20 12v2"/></symbol>
  </svg>

  <div class="backdrop" id="backdrop"></div>

  <header class="titlebar">
    <div class="titlebar__brand">
      <span class="brand-mark"><svg><use href="#i-terminal"/></svg></span>
      <span class="brand-name">LuwanTerm</span>
      <span class="brand-version" id="app-version"></span>
    </div>
    <div class="titlebar__drag"></div>
    <div class="titlebar__controls">
      <button class="winbtn" id="win-min" title="Minimize"><svg><use href="#i-min"/></svg></button>
      <button class="winbtn" id="win-max" title="Maximize"><svg><use href="#i-max"/></svg></button>
      <button class="winbtn winbtn--danger" id="win-close" title="Close"><svg><use href="#i-x"/></svg></button>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar glass">
      <div class="sidebar__search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input type="search" id="host-search" placeholder="Search hosts" autocomplete="off" />
      </div>

      <nav class="sidebar__tabs" id="sidebar-tabs">
        <button class="stab is-active" data-panel="hosts"><svg><use href="#i-server"/></svg>Hosts</button>
        <button class="stab" data-panel="keys"><svg><use href="#i-key"/></svg>Keys</button>
        <button class="stab" data-panel="snippets"><svg><use href="#i-code"/></svg>Snippets</button>
      </nav>

      <div class="sidebar__body">
        <section class="spanel is-active" data-panel="hosts">
          <div class="host-list" id="host-list"></div>
        </section>
        <section class="spanel" data-panel="keys">
          <div class="key-list" id="key-list"></div>
        </section>
        <section class="spanel" data-panel="snippets">
          <div class="snippet-list" id="snippet-list"></div>
        </section>
      </div>

      <footer class="sidebar__foot">
        <button class="btn btn--primary" id="btn-new"><svg><use href="#i-plus"/></svg><span id="btn-new-label">New host</span></button>
        <button class="btn btn--ghost btn--icon" id="btn-import-key" title="Add an existing key" hidden><svg><use href="#i-download"/></svg></button>
        <button class="btn btn--ghost btn--icon" id="btn-settings" title="Settings"><svg><use href="#i-cog"/></svg></button>
      </footer>
    </aside>

    <section class="workspace">
      <div class="tabbar">
        <div class="tabbar__tabs" id="tab-strip"></div>
        <div class="tabbar__tools" id="tab-tools" hidden>
          <button class="seg" data-dock="files" title="SFTP browser"><svg><use href="#i-folder"/></svg>Files</button>
          <button class="seg" data-dock="tunnels" title="Port forwarding"><svg><use href="#i-link"/></svg>Tunnels</button>
        </div>
      </div>

      <div class="stage">
        <div class="terminals" id="terminals"></div>

        <div class="empty" id="empty-state">
          <div class="empty__card glass">
            <span class="empty__mark"><svg><use href="#i-terminal"/></svg></span>
            <h1>No active session</h1>
            <p>Pick a host on the left to open a terminal, or create your first one.</p>
            <button class="btn btn--primary" id="empty-new-host"><svg><use href="#i-plus"/></svg>New host</button>
          </div>
        </div>

        <div class="dock-split" id="dock-split" hidden></div>
        <aside class="dock glass" id="dock" hidden>
          <div class="dock__head">
            <div class="dock__title" id="dock-title">Files</div>
            <button class="iconbtn" id="dock-close" title="Close panel"><svg><use href="#i-x"/></svg></button>
          </div>
          <div class="dock__body">
            <div class="dock__view" id="dock-files" hidden></div>
            <div class="dock__view" id="dock-tunnels" hidden></div>
          </div>
        </aside>
      </div>

      <div class="transfers" id="transfers"></div>
    </section>
  </main>

  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>

  <script src="js/dom.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/state.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/files.js"></script>
  <script src="js/tunnels.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/hosts.js"></script>
  <script src="js/snippets.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
