<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Starting Luwan Shell</title>
  <style>
    :root {
      --accent: #7c5cff;
      --ink: #eef0f8;
      --ink-mute: #a5abc4;
      --ink-faint: #6d7392;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(70% 60% at 20% 0%, rgba(124, 92, 255, 0.28), transparent 70%),
        radial-gradient(60% 60% at 100% 100%, rgba(62, 168, 255, 0.2), transparent 65%),
        linear-gradient(160deg, #0a0b12, #06070c);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .card { display: grid; justify-items: center; gap: 13px; padding: 0 28px; width: 100%; }

    .mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      animation: breathe 2.4s ease-in-out infinite;
    }
    .mark svg {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(124, 92, 255, 0.35);
    }
    @keyframes breathe { 50% { transform: translateY(-3px); } }

    .name { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }

    .track {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #3ea8ff);
      transition: width 260ms cubic-bezier(0.22, 0.85, 0.28, 1);
    }

    .status { font-size: 11.5px; color: var(--ink-mute); min-height: 16px; text-align: center; }
    .detail { font-size: 10.5px; color: var(--ink-faint); min-height: 14px; }

    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <span class="mark"><svg viewBox="0 0 128 128"><defs><linearGradient id="lw-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3ea8ff"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="#14161c"/><path d="M38 42 L68 64 L38 86" fill="none" stroke="url(#lw-grad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="82" width="26" height="11" rx="5.5" fill="url(#lw-grad)" stroke="none"/><circle cx="98" cy="36" r="5" fill="#3ea8ff" stroke="none"/></svg></span>
    <span class="name">Luwan Shell</span>

    <span class="track"><span class="fill" id="fill"></span></span>
    <span class="status" id="status">Starting up</span>
    <span class="detail" id="detail"></span>

    </div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
